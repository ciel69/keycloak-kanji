version: "3.9"

services:
  keycloak:  # <-- ПЕРВЫМ должен идти сервис, который должен быть доступен по домену
    # ВАЖНО: контейнеру нужен исходящий доступ в интернет (egress) для работы SMTP —
    # без него не будут отправляться письма подтверждения почты, сброса пароля и т.д.
    # Если хост стоит за firewall/NAT с ограничениями, разрешите исходящие соединения
    # на порт вашего SMTP-сервера (обычно 587/465/25) для контейнера keycloak.
    build: .
    container_name: keycloak
    restart: always
    environment:
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
        KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
        KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

        # Главное исправление: простой hostname для локального запуска
        #KC_HOSTNAME: localhost
        KC_HOSTNAME_PORT: 8080
        KC_HTTP_ENABLED: true

        # Эти переменные для локального запуска не нужны, убираем их
        KC_HOSTNAME_URL: https://${KEYCLOAK_HOSTNAME}
        KC_HOSTNAME_ADMIN_URL: https://${KEYCLOAK_HOSTNAME}
        KC_PROXY: edge
        KC_PROXY_HEADERS: xforwarded
        KC_HOSTNAME_STRICT: false
        KC_HOSTNAME_STRICT_BACKCHANNEL: false

        # SMTP настройки подставляются в realm-export.json через ${SMTP_*}
        # при импорте realm. Требуется исходящий доступ в интернет к SMTP-хосту.
        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_FROM: ${SMTP_FROM}
        SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASSWORD: ${SMTP_PASSWORD}
        SMTP_STARTTLS: ${SMTP_STARTTLS}
        SMTP_AUTH: ${SMTP_AUTH}
    command: start
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: kc_postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    # У postgres НЕ должно быть ports, если не нужен прямой доступ
