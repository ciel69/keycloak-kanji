emailVerificationSubject=Подтвердите email — Kanji Flow
emailVerificationBody=Добро пожаловать в Kanji Flow! Вы зарегистрировали аккаунт с этим email. Перейдите по ссылке ниже, чтобы подтвердить адрес и начать заниматься.\n\n{0}\n\nСсылка действует {3}.\n\nЕсли вы не создавали этот аккаунт — просто игнорируйте это письмо.
emailVerificationBodyHtml=<p>Добро пожаловать в <b>Kanji Flow</b>! Вы зарегистрировали аккаунт с этим email. Подтвердите адрес, чтобы начать пользоваться платформой.</p><p style="text-align:center; margin:28px 0;"><a href="{0}" style="display:inline-block; background-color:#6f4e73; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:6px; font-weight:600; font-size:14px;">Подтвердить email</a></p><p style="font-size:13px; color:#6b7280;">Ссылка действует {3}. Если кнопка не работает, скопируйте адрес в браузер:</p><p style="font-size:12px; color:#8b5a8f; word-break:break-all; overflow-wrap:break-word; max-width:100%;"><a href="{0}" style="color:#8b5a8f; word-break:break-all; overflow-wrap:break-word;">{0}</a></p><p style="font-size:13px; color:#6b7280;">Если вы не создавали этот аккаунт — просто игнорируйте это письмо.</p>

passwordResetSubject=Сброс пароля — Kanji Flow
passwordResetBody=Кто-то запросил сброс пароля для вашего аккаунта Kanji Flow. Если это были вы, перейдите по ссылке ниже.\n\n{0}\n\nСсылка действует {3}.\n\nЕсли вы не запрашивали сброс пароля — просто игнорируйте это письмо, ничего не изменится.
passwordResetBodyHtml=<p>Кто-то запросил сброс пароля для вашего аккаунта <b>Kanji Flow</b>. Если это были вы, нажмите на кнопку ниже, чтобы задать новый пароль.</p><p style="text-align:center; margin:28px 0;"><a href="{0}" style="display:inline-block; background-color:#6f4e73; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:6px; font-weight:600; font-size:14px;">Сбросить пароль</a></p><p style="font-size:13px; color:#6b7280;">Ссылка действует {3}.</p><p style="font-size:13px; color:#6b7280;">Если вы не запрашивали сброс пароля — просто игнорируйте это письмо, ничего не изменится.</p>

emailUpdateConfirmationSubject=Подтвердите новый email — Kanji Flow
emailUpdateConfirmationBody=Чтобы обновить ваш аккаунт Kanji Flow на новый email {1}, перейдите по ссылке ниже.\n\n{0}\n\nСсылка действует {3}.\n\nЕсли вы не хотите менять email — просто игнорируйте это письмо.
emailUpdateConfirmationBodyHtml=<p>Чтобы обновить аккаунт <b>Kanji Flow</b> на новый email <b>{1}</b>, нажмите на кнопку ниже. Ваш прогресс и настройки сохранятся.</p><p style="text-align:center; margin:28px 0;"><a href="{0}" style="display:inline-block; background-color:#6f4e73; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:6px; font-weight:600; font-size:14px;">Подтвердить новый email</a></p><p style="font-size:13px; color:#6b7280;">Ссылка действует {3}.</p><p style="font-size:13px; color:#6b7280;">Если вы не хотите менять email — просто игнорируйте это письмо.</p>

