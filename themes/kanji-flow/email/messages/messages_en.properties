passwordResetBodyHtml=<p>Someone requested a password reset for your <b>Kanji Flow</b> account. If this was you, click the button below to set a new password.</p><p style="text-align:center; margin:28px 0;"><a href="{0}" style="display:inline-block; background-color:#6f4e73; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:6px; font-weight:600; font-size:14px;">Reset password</a></p><p style="font-size:13px; color:#6b7280;">This link expires in {3}.</p><p style="font-size:13px; color:#6b7280;">If you didn''t request this, just ignore this email and nothing will change.</p>

