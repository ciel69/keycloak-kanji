emailVerificationSubject=Verify your email — Kanji Flow
emailVerificationBody=Welcome to Kanji Flow! You created an account with this email address. Follow the link below to confirm it and start using the platform.\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn''t create this account, just ignore this email.
emailVerificationBodyHtml=<p>Welcome to <b>Kanji Flow</b>! You created an account with this email address. Confirm it to start using the platform.</p><p style="text-align:center; margin:28px 0;"><a href="{0}" style="display:inline-block; background-color:#6f4e73; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:6px; font-weight:600; font-size:14px;">Verify email</a></p><p style="font-size:13px; color:#6b7280;">This link expires in {3}. If the button doesn''t work, copy this address into your browser:</p><p style="font-size:12px; color:#8b5a8f; word-break:break-all; overflow-wrap:break-word; max-width:100%;"><a href="{0}" style="color:#8b5a8f; word-break:break-all; overflow-wrap:break-word;">{0}</a></p><p style="font-size:13px; color:#6b7280;">If you didn''t create this account, just ignore this email.</p>

